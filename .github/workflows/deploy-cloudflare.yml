name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Display runtime versions
        run: |
          node --version
          npx --yes npm@12.0.1 --version

      - name: Install dependencies
        run: npx --yes npm@12.0.1 ci

      - name: Build
        run: npx --yes npm@12.0.1 run build

      - name: Deploy
        run: npx --yes @vinext/cloudflare@1.0.0-beta.4 deploy --skip-build